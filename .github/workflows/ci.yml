name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Windows too: local development happens there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec cdk synth -q
        working-directory: packages/infra
        env:
          # Synth refuses to run without a client ID. It is not a secret, and this
          # check only validates the template, so a placeholder is enough.
          SPOTIFY_CLIENT_ID: ci-synth-placeholder

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repository.
permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Windows too: local development happens there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        if: runner.os != 'Linux'
      # On Ubuntu the tests run with coverage; the job summary shows it per package.
      - run: pnpm test:coverage
        if: runner.os == 'Linux'
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
      - run: pnpm build
      - run: pnpm exec cdk synth -q
        working-directory: packages/infra
        env:
          # Synth refuses to run without a client ID. It is not a secret, and this
          # check only validates the template, so a placeholder is enough.
          SPOTIFY_CLIENT_ID: ci-synth-placeholder
